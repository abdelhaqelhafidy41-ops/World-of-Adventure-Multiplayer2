name: Web Frontend CI & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target web environment (staging or production)"
        required: false
        default: "production"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build-web:
    name: Build & Verify Web Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend & shared protocol
        run: npm run lint

      - name: Verify multiplayer protocol & Durable Object suite
        run: npm run test:multiplayer

      - name: Build production web bundle
        env:
          VITE_APP_ENV: ${{ inputs.environment || vars.VITE_APP_ENV || 'production' }}
          VITE_MULTIPLAYER_URL: ${{ vars.VITE_MULTIPLAYER_URL || 'https://world-of-adventure-multiplayer2.abdelhaq-elhafidy-41.workers.dev' }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || vars.PUBLIC_APP_URL || 'https://abdelhaqelhafidy41-ops.github.io/World-of-Adventure-Multiplayer2/' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || vars.VITE_PUBLIC_APP_URL || 'https://abdelhaqelhafidy41-ops.github.io/World-of-Adventure-Multiplayer2/' }}
        run: npm run build

      - name: Upload built web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-of-adventure-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy-cloudflare-pages:
    name: Deploy to Cloudflare Pages (Optional)
    runs-on: ubuntu-latest
    needs: build-web
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      vars.CLOUDFLARE_PAGES_PROJECT != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: world-of-adventure-web-dist
          path: dist

      - name: Deploy web bundle to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
